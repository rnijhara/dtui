[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtui"
version = "0.1.0"
description = "A full-screen terminal app for diffusion language models: a lightweight coding agent, and a mode that visualizes the denoising process as a token canvas resolving out of noise."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Roopak Nijhara" }]
keywords = ["diffusion", "llm", "tui", "textual", "terminal", "diffusiongemma", "llada", "dream"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "click>=8.1",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# Heavy, GPU-side dependencies for running open diffusion models in-process.
# Only needed for local viz mode. Simple mode and remote (e.g. Mercury) viz work without these.
local = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.57",
    "accelerate>=0.34",
    "pillow>=10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
all = ["dtui[local]"]

[project.scripts]
dtui = "dtui.cli:main"

[project.urls]
Homepage = "https://github.com/rnijhara/dtui"
Repository = "https://github.com/rnijhara/dtui"

[tool.hatch.build.targets.wheel]
packages = ["src/dtui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Pluggable third-party model adapters register under this entry-point group:
#   [project.entry-points."dtui.adapter"]
#   mymodel = "my_pkg.adapter:MyTrajectoryProvider"
